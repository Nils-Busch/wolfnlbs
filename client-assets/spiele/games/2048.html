<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>2048 · Spielegalerie</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">
<script src="/shared/pwa.js" defer></script>
</head>
<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><g class="a-plopp"><rect x="4" y="4" width="40" height="40" rx="6" fill="var(--vh-yellow)"/><text x="24" y="30" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="16" fill="var(--vh-ink)">2048</text></g></svg>2048</h1></header>
<main class="solo">
  <div>
    <div class="hud"><div class="stat">Punkte<b id="score">0</b></div><div class="stat">Rekord (Gerät)<b id="best">0</b></div><div class="spacer"></div><button id="newGame" class="ghost">Neues Spiel</button></div>
    <div class="board-wrap">
      <div class="g2048" id="board" aria-label="2048-Spielfeld"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row" id="ovButtons"></div></div>
    </div>
    <p class="hint">Pfeiltasten oder WASD (am Handy wischen) schieben alle Kacheln. Gleiche Zahlen verschmelzen – schaffst du 2048?</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/2048.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
