<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Memory · Spielegalerie</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">

</head>
<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-9 16 24)"><rect x="5" y="8" width="22" height="30" rx="3" fill="var(--vh-blue)"/><path d="M9 12l14 14M9 20l10 10M13 12l10 10M17 12l6 6M9 28l6 6" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/></g><g class="a-wende"><g transform="rotate(8 32 24)"><rect x="21" y="9" width="22" height="30" rx="3" fill="#fff" stroke="var(--vh-ink)" stroke-width="2"/><path d="M32 30c-6-4-8-7-8-9.5 0-2 1.5-3.5 3.6-3.5 2 0 3.4 1.6 4.4 3 1-1.4 2.4-3 4.4-3 2.1 0 3.6 1.5 3.6 3.5 0 2.5-2 5.5-8 9.5z" fill="var(--vh-red)"/></g></g></svg>Memory</h1></header>
<main class="solo">
  <div>
    <div class="hud"><div class="stat">Züge<b id="moves">0</b></div><div class="stat">Paare<b id="pairs">0/8</b></div><div class="stat">Zeit<b id="time">0:00</b></div><div class="spacer"></div><button id="newGame" class="ghost">Neu mischen</button></div>
    <div class="board-wrap">
      <div class="mem" id="board"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row" id="ovButtons"><button id="ovBtn">Nochmal</button></div></div>
    </div>
    <p class="hint">Decke zwei Karten auf – finde alle 8 Paare mit möglichst wenigen Zügen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/memory.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
