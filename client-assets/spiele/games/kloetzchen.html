<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klötzchen · Spielegalerie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟪</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#172036">
<script src="/shared/pwa.js" defer></script>
</head>
<body>
<header class="top"><a href="/spiele/" class="back">← Galerie</a><h1>🟪 Klötzchen</h1></header>
<main class="solo kz">
  <div class="kz-main">
    <div class="hud">
      <div class="stat">Punkte<b id="kzScore">0</b></div>
      <div class="stat">Rekord<b id="kzBest">0</b></div>
      <div class="stat kz-combo" id="kzComboBox">Kombo<b id="kzCombo">–</b></div>
      <div class="spacer"></div>
      <button id="kzNew" class="ghost">Neues Spiel</button>
    </div>
    <div class="board-wrap kz-wrap">
      <div class="kz-board" id="kzBoard" role="grid" aria-label="Spielfeld 8 mal 8"></div>
      <p class="kz-banner" id="kzBanner" aria-live="polite"></p>
      <div class="overlay" id="kzOverlay" hidden><p id="kzOvText"></p><div class="row"><button id="kzAgain">Nochmal</button></div></div>
    </div>
    <div class="kz-tray" id="kzTray" aria-label="Deine drei Blöcke"></div>
    <p class="hint">Blöcke aufs Feld ziehen. Volle Reihen und Spalten verschwinden – mehrere auf einmal und Abräumen in Folge (Kombo) bringen viel mehr Punkte. Drehen geht nicht. Tastatur: 1–3 wählen, Pfeile schieben, Enter setzen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<div class="kz-fx" id="kzFx" aria-hidden="true"></div>
<script src="/shared/motion.js"></script>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/kloetzchen.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
