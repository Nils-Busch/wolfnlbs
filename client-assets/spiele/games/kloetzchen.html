<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Klötzchen · Spielegalerie</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">

</head>
<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="2.5" y="2.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="2.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="2.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="2.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="13.5" y="2.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="13.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="13.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="13.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="24.5" y="2.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="24.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="24.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="24.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="35.5" y="2.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="35.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="35.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="35.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-line-strong)" opacity=".45"/><rect x="2.5" y="2.5" width="10" height="10" rx="2" fill="var(--vh-teal)"/><rect x="2.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-teal)"/><rect x="13.5" y="13.5" width="10" height="10" rx="2" fill="var(--vh-teal)"/><g class="a-fall"><rect x="24.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-red)"/><rect x="35.5" y="24.5" width="10" height="10" rx="2" fill="var(--vh-red)"/><rect x="24.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-red)"/><rect x="35.5" y="35.5" width="10" height="10" rx="2" fill="var(--vh-red)"/></g></svg>Klötzchen</h1></header>
<main class="solo kz">
  <div class="kz-main">
    <div class="hud">
      <div class="stat">Punkte<b id="kzScore">0</b></div>
      <div class="stat">Rekord<b id="kzBest">0</b></div>
      <div class="stat kz-combo" id="kzComboBox">Kombo<b id="kzCombo">–</b></div>
      <div class="spacer"></div>
      <button id="kzNew" class="ghost">Neues Spiel</button>
    </div>
    <div class="board-wrap kz-wrap">
      <div class="kz-board" id="kzBoard" role="grid" aria-label="Spielfeld 8 mal 8"></div>
      <p class="kz-banner" id="kzBanner" aria-live="polite"></p>
      <div class="overlay" id="kzOverlay" hidden><p id="kzOvText"></p><div class="row"><button id="kzAgain">Nochmal</button></div></div>
    </div>
    <div class="kz-tray" id="kzTray" aria-label="Deine drei Blöcke"></div>
    <p class="hint">Blöcke aufs Feld ziehen. Volle Reihen und Spalten verschwinden – mehrere auf einmal und Abräumen in Folge (Kombo) bringen viel mehr Punkte. Drehen geht nicht. Tastatur: 1–3 wählen, Pfeile schieben, Enter setzen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<div class="kz-fx" id="kzFx" aria-hidden="true"></div>
<script src="/shared/motion.js"></script>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/kloetzchen.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
