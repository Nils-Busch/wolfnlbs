<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockfall · Spielegalerie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
</head>
<body>
<header class="top"><a href="/spiele/" class="back">← Galerie</a><h1>🧱 Blockfall</h1></header>
<main class="solo">
  <div>
    <div class="hud">
      <div class="stat">Punkte<b id="score">0</b></div>
      <div class="stat">Reihen<b id="lines">0</b></div>
      <div class="stat">Level<b id="level">1</b></div>
      <div class="spacer"></div>
      <button id="pause" class="ghost">⏸ Pause</button>
    </div>
    <div class="bf">
      <div class="board-wrap">
        <canvas id="board" aria-label="Blockfall-Spielfeld"></canvas>
        <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row"><button id="ovBtn">Start</button></div></div>
      </div>
      <div class="side">
        <div class="muted">Nächster</div>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
    </div>
    <div class="pad">
      <button id="padL" class="ghost" aria-label="links">◀</button>
      <button id="padRot" class="ghost" aria-label="drehen">⟳</button>
      <button id="padR" class="ghost" aria-label="rechts">▶</button>
      <button id="padDown" class="ghost" aria-label="schneller">▼</button>
      <button id="padDrop" aria-label="fallen lassen">⤓</button>
    </div>
    <p class="hint">← → bewegen · ↑ oder X drehen (Z/Y andersrum) · ↓ schneller · Leertaste fallen lassen · P Pause. Am Handy: tippen = drehen, wischen = bewegen, nach unten wischen = fallen lassen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/blockfall.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
