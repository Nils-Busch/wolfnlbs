<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="/shared/theme.js"></script>
<title>Wordle · Tagesrätsel</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="stylesheet" href="/raetsel/raetsel.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">
<script src="/shared/pwa.js" defer></script>
</head>
<body class="rt">
<header class="top"><a href="/raetsel/" class="back">Tagesrätsel</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><rect class="a-karte" style="--n:0" x="2" y="15" width="8.5" height="18" rx="2" fill="var(--vh-green)"/><rect class="a-karte" style="--n:1" x="11" y="15" width="8.5" height="18" rx="2" fill="var(--vh-yellow)"/><rect class="a-karte" style="--n:2" x="20" y="15" width="8.5" height="18" rx="2" fill="#8b968f"/><rect class="a-karte" style="--n:3" x="29" y="15" width="8.5" height="18" rx="2" fill="var(--vh-green)"/><rect class="a-karte" style="--n:4" x="38" y="15" width="8.5" height="18" rx="2" fill="var(--vh-green)"/><text x="6.25" y="28" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#fff">R</text><text x="15.25" y="28" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#fff">A</text><text x="24.25" y="28" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#fff">T</text><text x="33.25" y="28" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#fff">E</text><text x="42.25" y="28" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#fff">N</text></svg>Wordle</h1></header>
<main class="solo">
  <div class="wd">
    <div class="hud">
      <div class="levels" role="tablist">
        <button id="modeDaily" class="on" role="tab">Tagesrätsel</button>
        <button id="modeFree" role="tab">Freies Spiel</button>
      </div>
      <div class="spacer"></div>
      <div class="stat">Rätsel<b id="label">…</b></div>
    </div>
    <div class="wd-msg" id="msg" role="status" aria-live="polite"></div>
    <div class="wd-grid" id="grid" aria-label="Spielfeld"></div>
    <div class="wd-end" id="end" hidden></div>
    <div class="wd-kb" id="kb"></div>
    <p class="hint">Errate das deutsche Wort mit 5 Buchstaben in 6 Versuchen. <span class="farbe g"></span> richtige Stelle, <span class="farbe y"></span> kommt vor, andere Stelle, <span class="farbe b"></span> kommt nicht vor.
      Wörter mit Ä, Ö, Ü oder ß kommen nicht vor. Das Tagesrätsel wechselt um Mitternacht.</p>
  </div>
  <aside>
    <div class="panel" id="board"><h2>Heute</h2><p class="muted">Lade …</p></div>
    <a class="side-lb-link" href="/raetsel/bestenliste.html" style="margin: .8rem 0 0 .2rem">Ewige Bestenliste</a>
    <div class="panel wd-stats" id="stats" style="margin-top:1rem"></div>
  </aside>
</main>
<script src="/shared/motion.js"></script>
<script src="/spiele/js/games/wordle.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
