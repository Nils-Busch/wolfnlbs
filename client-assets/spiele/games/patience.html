<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-10 18 26)"><rect x="6" y="9" width="22" height="31" rx="3" fill="var(--vh-green)"/><rect x="9" y="12" width="16" height="25" rx="2" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2.5 2"/></g><g class="a-wende"><g transform="rotate(7 31 24)"><rect x="20" y="8" width="22" height="31" rx="3" fill="#fff" stroke="var(--vh-ink)" stroke-width="1.6"/><text x="24.5" y="17" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="8" fill="var(--vh-red)">A</text><path d="M31 32c-4.5-3-6-5.2-6-7 0-1.5 1.1-2.6 2.6-2.6 1.4 0 2.6 1.1 3.4 2.2.8-1.1 2-2.2 3.4-2.2 1.5 0 2.6 1.1 2.6 2.6 0 1.8-1.5 4-6 7z" fill="var(--vh-red)"/></g></g></svg>Patience</h1></header>
<main class="solo pa-solo">
  <div>
    <div class="hud"><div class="stat">Zeit<b id="time">0:00</b></div><div class="stat">Züge<b id="moves">0</b></div><div class="spacer"></div><button id="undo" class="ghost" disabled>Zurück</button><button id="newGame" class="ghost">Neu geben</button></div>
    <div class="pa-wrap">
      <div class="pa" id="board" aria-label="Spieltisch"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row"><button id="ovBtn">Neu geben</button></div></div>
    </div>
    <p class="hint">Karten absteigend und in wechselnden Farben auf die sieben Reihen legen, oben rechts nach Farbe von Ass bis König sammeln. Antippen legt eine Karte dorthin, wo sie passt, Ziehen geht auch. Leere Reihen nehmen nur einen König.</p>
  </div>
  <aside id="scores"></aside>
</main>
