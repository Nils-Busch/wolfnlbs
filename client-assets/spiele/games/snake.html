<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Snake · Spielegalerie</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">
<script src="/shared/pwa.js" defer></script>
</head>
<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><g class="a-kriech"><rect x="5.0" y="35.5" width="9" height="9" rx="2" fill="var(--vh-green)"/><rect x="15.5" y="35.5" width="9" height="9" rx="2" fill="var(--vh-green)"/><rect x="26.0" y="35.5" width="9" height="9" rx="2" fill="var(--vh-green)"/><rect x="26.0" y="25.0" width="9" height="9" rx="2" fill="var(--vh-green)"/><rect x="26.0" y="14.5" width="9" height="9" rx="2" fill="var(--vh-green)"/><rect x="36.5" y="14.5" width="9" height="9" rx="2" fill="#0c6b3e"/></g><g class="a-hoch"><circle cx="11" cy="14" r="4.5" fill="var(--vh-red)"/><path d="M11 9.5c0-2 1-3 2.5-3.5" stroke="var(--vh-green)" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></svg>Snake</h1></header>
<main class="solo">
  <div>
    <div class="hud"><div class="stat">Punkte<b id="score">0</b></div><div class="stat">Länge<b id="length">3</b></div><div class="stat">Rekord (Gerät)<b id="best">0</b></div><div class="spacer"></div><button id="pause" class="ghost">Pause</button></div>
    <div class="board-wrap">
      <canvas id="board" width="480" height="480" aria-label="Snake-Spielfeld"></canvas>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row" id="ovButtons"><button id="ovBtn">Start</button></div></div>
    </div>
    <p class="hint">Steuerung: Pfeiltasten oder WASD · Leertaste/P = Pause · am Handy wischen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/snake.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
