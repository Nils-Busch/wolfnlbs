<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake · Spielegalerie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
</head>
<body>
<header class="top"><a href="/spiele/" class="back">← Galerie</a><h1>🐍 Snake</h1></header>
<main class="solo">
  <div>
    <div class="hud"><div class="stat">Punkte<b id="score">0</b></div><div class="stat">Länge<b id="length">3</b></div><div class="stat">Rekord (Gerät)<b id="best">0</b></div><div class="spacer"></div><button id="pause" class="ghost">⏸ Pause</button></div>
    <div class="board-wrap">
      <canvas id="board" width="480" height="480" aria-label="Snake-Spielfeld"></canvas>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row" id="ovButtons"><button id="ovBtn">Start</button></div></div>
    </div>
    <p class="hint">Steuerung: Pfeiltasten oder WASD · Leertaste/P = Pause · am Handy wischen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/snake.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
