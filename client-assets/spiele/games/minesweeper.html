<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper · Spielegalerie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
</head>
<body>
<header class="top"><a href="/spiele/" class="back">← Galerie</a><h1>💣 Minesweeper</h1></header>
<main class="solo">
  <div>
    <div class="hud">
      <div class="stat">Minen<b id="mines">10</b></div>
      <div class="stat">Sekunden<b id="time">0</b></div>
      <div class="levels"><button class="ghost" data-lvl="s9">Klein</button><button class="ghost" data-lvl="s16">Groß</button></div>
      <div class="spacer"></div>
      <button id="flagMode" class="ghost flagmode">🚩 Fahnen-Modus</button>
      <button id="newGame" class="ghost">Neu</button>
    </div>
    <div class="board-wrap">
      <div id="board" class="ms"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row"><button id="ovBtn">Nochmal</button></div></div>
    </div>
    <p class="hint">Linksklick deckt auf, Rechtsklick setzt eine Fahne (am Handy: lange drücken oder Fahnen-Modus). Klick auf eine Zahl mit passend vielen Fahnen deckt die Nachbarn auf. Der erste Klick ist immer sicher.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/minesweeper.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
