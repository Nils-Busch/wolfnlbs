<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Minesweeper · Spielegalerie</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">
<script src="/shared/pwa.js" defer></script>
</head>
<body>
<header class="top"><a href="/spiele/" class="back">Spielegalerie</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="3" width="13" height="13" rx="2" fill="#dfe3dc"/><rect x="18" y="3" width="13" height="13" rx="2" fill="#dfe3dc"/><rect x="33" y="3" width="13" height="13" rx="2" fill="var(--vh-line-strong)"/><rect x="3" y="18" width="13" height="13" rx="2" fill="#dfe3dc"/><rect x="18" y="18" width="13" height="13" rx="2" fill="#dfe3dc"/><rect x="33" y="18" width="13" height="13" rx="2" fill="var(--vh-line-strong)"/><rect x="3" y="33" width="13" height="13" rx="2" fill="var(--vh-line-strong)"/><rect x="18" y="33" width="13" height="13" rx="2" fill="var(--vh-line-strong)"/><rect x="33" y="33" width="13" height="13" rx="2" fill="var(--vh-line-strong)"/><text x="24.5" y="14" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="12" fill="var(--vh-blue)">1</text><text x="24.5" y="29" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="12" fill="var(--vh-green)">2</text><text x="9.5" y="29" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="12" fill="var(--vh-blue)">1</text><path d="M38 21v12" stroke="var(--vh-ink)" stroke-width="1.8"/><path class="a-flagge" d="M38 21l7 3.5-7 3.5z" fill="var(--vh-red)"/></svg>Minesweeper</h1></header>
<main class="solo">
  <div>
    <div class="hud">
      <div class="stat">Minen<b id="mines">10</b></div>
      <div class="stat">Sekunden<b id="time">0</b></div>
      <div class="levels"><button class="ghost" data-lvl="s9">Klein</button><button class="ghost" data-lvl="s16">Groß</button></div>
      <div class="spacer"></div>
      <button id="flagMode" class="ghost flagmode">Fahnen-Modus</button>
      <button id="newGame" class="ghost">Neu</button>
    </div>
    <div class="board-wrap">
      <div id="board" class="ms"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row"><button id="ovBtn">Nochmal</button></div></div>
    </div>
    <p class="hint">Linksklick deckt auf, Rechtsklick setzt eine Fahne (am Handy: lange drücken oder Fahnen-Modus). Klick auf eine Zahl mit passend vielen Fahnen deckt die Nachbarn auf. Der erste Klick ist immer sicher.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/minesweeper.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
