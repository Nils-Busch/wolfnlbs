<body class="rt">
<header class="top"><a href="/raetsel/" class="back">Tagesrätsel</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="14" width="7" height="7" rx="1" fill="#cfd6cc"/><rect x="22" y="14" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="30" y="14" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="38" y="14" width="7" height="7" rx="1" fill="#cfd6cc"/><rect x="14" y="22" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="22" y="22" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="30" y="22" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="38" y="22" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="14" y="30" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="22" y="30" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="30" y="30" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="38" y="30" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="14" y="38" width="7" height="7" rx="1" fill="#cfd6cc"/><rect x="22" y="38" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="30" y="38" width="7" height="7" rx="1" fill="var(--vh-ink)"/><rect x="38" y="38" width="7" height="7" rx="1" fill="#cfd6cc"/><text x="5" y="21" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9" fill="var(--vh-ink)">2</text><text x="5" y="37" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9" fill="var(--vh-ink)">2</text><text x="5" y="29" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9" fill="var(--vh-ink)">4</text><text x="18" y="10" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9" fill="var(--vh-ink)">2</text><text x="34" y="10" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9" fill="var(--vh-ink)">2</text></svg>Nonogramm <span class="rt-num" id="nnNum"></span></h1></header>
<main class="solo nn">
  <div class="nn-main">
    <div class="st-modes">
      <div class="levels" id="nnModes" role="tablist">
        <button data-mode="daily" role="tab">Tagesrätsel</button>
        <button data-mode="free" role="tab">Freies Spiel</button>
      </div>
      <div class="vs-levels" id="nnSizes" hidden role="group" aria-label="Größe">
        <button type="button" data-size="5">5 × 5</button>
        <button type="button" data-size="10">10 × 10</button>
        <button type="button" data-size="15">15 × 15</button>
      </div>
    </div>
    <div class="nn-bar">
      <div class="vs-levels nn-tools" id="nnTools" role="group" aria-label="Werkzeug">
        <button type="button" data-tool="fill" class="on">■ Füllen</button>
        <button type="button" data-tool="x">✕ Markieren</button>
      </div>
      <span class="nn-time">Zeit <b id="nnTime">0:00</b></span>
      <button class="ghost" id="nnReset">Leeren</button>
    </div>
    <div class="nn-wrap"><div class="nn-board" id="nnBoard"></div></div>
    <p class="nn-done" id="nnDone" hidden></p>
    <p class="hint">Die Zahlen sagen, wie viele Felder am Stück gefüllt sind – in dieser Reihenfolge, mit mindestens einem Leerfeld dazwischen. Ziehen füllt mehrere Felder, Rechtsklick oder „Markieren“ setzt ein ✕ für sichere Leerfelder.</p>
  </div>
  <aside class="st-side" id="side"></aside>
</main>
<script src="/shared/motion.js"></script>
<script src="/raetsel/js/daily.js"></script>
<script src="/raetsel/js/nonogramm.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
