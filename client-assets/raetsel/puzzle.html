<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Puzzle · Tagesrätsel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="stylesheet" href="/raetsel/raetsel.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#172036">
<script src="/shared/pwa.js" defer></script>
</head>
<body class="rt">
<header class="top"><a href="/raetsel/" class="back">← Tagesrätsel</a><h1>🧩 Puzzle <span class="rt-num" id="jgNum"></span></h1></header>
<main class="jg">
  <div class="st-modes">
    <div class="levels" id="jgModes" role="tablist">
      <button data-mode="daily" role="tab">Tagespuzzle</button>
      <button data-mode="free" role="tab">Freies Puzzle</button>
    </div>
    <div class="vs-levels" id="jgSizes" hidden role="group" aria-label="Anzahl Teile">
      <button type="button" data-size="12">12 Teile</button>
      <button type="button" data-size="24">24 Teile</button>
      <button type="button" data-size="54">54 Teile</button>
    </div>
  </div>
  <div class="jg-bar">
    <span class="jg-time">⏱ <b id="jgTime">0:00</b></span>
    <span class="jg-prog" aria-label="Fortschritt"><i id="jgBar"></i></span>
    <span class="jg-count" id="jgCount">0 / 24</span>
    <span class="spacer"></span>
    <button class="ghost small" id="jgPeek" aria-pressed="false" title="Das ganze Bild blass im Rahmen zeigen">👁 Vorlage</button>
    <button class="ghost small" id="jgEdges" title="Randteile nach vorne legen">▢ Ränder zuerst</button>
    <button class="ghost small" id="jgShuffle" title="Lose Teile neu verteilen">🔀 Mischen</button>
  </div>
  <div class="jg-table" id="jgTable">
    <div class="jg-frame" id="jgFrame"><canvas class="jg-ghost" id="jgGhost"></canvas><canvas class="jg-final" id="jgFinal" hidden></canvas></div>
  </div>
  <p class="jg-title" id="jgTitle" aria-live="polite"></p>
  <p class="nn-done" id="jgDone" hidden></p>
  <p class="hint">Teile mit Maus oder Finger auf den Rahmen ziehen. Liegt ein Teil nah genug an seinem Platz, rastet es ein. Die Uhr startet mit dem ersten Teil. Jeden Tag gibt es ein neues, für alle gleiches Bild.</p>
  <aside class="st-side jg-side" id="side"></aside>
</main>
<script src="/shared/motion.js"></script>
<script src="/raetsel/js/daily.js"></script>
<script src="/raetsel/js/puzzle-art.js"></script>
<script src="/raetsel/js/puzzle.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
