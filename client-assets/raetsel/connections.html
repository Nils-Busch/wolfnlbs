<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/shared/theme.js"></script>
<title>Connections · Tagesrätsel</title>
<link rel="icon" href="/shared/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spiele/css/style.css">
<link rel="stylesheet" href="/raetsel/raetsel.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#e6ebe3">
<script src="/shared/pwa.js" defer></script>
</head>
<body class="rt">
<header class="top"><a href="/raetsel/" class="back">Tagesrätsel</a><h1><svg class="top-icon" viewBox="0 0 48 48" aria-hidden="true"><rect class="a-karte" style="--n:0" x="3" y="3" width="9.5" height="9.5" rx="2" fill="#f2c230"/><rect class="a-karte" style="--n:1" x="14" y="3" width="9.5" height="9.5" rx="2" fill="#f2c230"/><rect class="a-karte" style="--n:2" x="25" y="3" width="9.5" height="9.5" rx="2" fill="#f2c230"/><rect class="a-karte" style="--n:3" x="36" y="3" width="9.5" height="9.5" rx="2" fill="#f2c230"/><rect class="a-karte" style="--n:4" x="3" y="14" width="9.5" height="9.5" rx="2" fill="#4fbf7f"/><rect class="a-karte" style="--n:5" x="14" y="14" width="9.5" height="9.5" rx="2" fill="#4fbf7f"/><rect class="a-karte" style="--n:6" x="25" y="14" width="9.5" height="9.5" rx="2" fill="#4fbf7f"/><rect class="a-karte" style="--n:7" x="36" y="14" width="9.5" height="9.5" rx="2" fill="#4fbf7f"/><rect class="a-karte" style="--n:8" x="3" y="25" width="9.5" height="9.5" rx="2" fill="#5b8de0"/><rect class="a-karte" style="--n:9" x="14" y="25" width="9.5" height="9.5" rx="2" fill="#5b8de0"/><rect class="a-karte" style="--n:10" x="25" y="25" width="9.5" height="9.5" rx="2" fill="#5b8de0"/><rect class="a-karte" style="--n:11" x="36" y="25" width="9.5" height="9.5" rx="2" fill="#5b8de0"/><rect class="a-karte" style="--n:12" x="3" y="36" width="9.5" height="9.5" rx="2" fill="#a979d8"/><rect class="a-karte" style="--n:13" x="14" y="36" width="9.5" height="9.5" rx="2" fill="#a979d8"/><rect class="a-karte" style="--n:14" x="25" y="36" width="9.5" height="9.5" rx="2" fill="#a979d8"/><rect class="a-karte" style="--n:15" x="36" y="36" width="9.5" height="9.5" rx="2" fill="#a979d8"/></svg>Connections <span class="rt-num" id="cnNum"></span></h1></header>
<main class="solo cn">
  <div class="cn-main">
    <div class="st-modes">
      <div class="levels" id="cnModes" role="tablist">
        <button data-mode="daily" role="tab">Tagesrätsel</button>
        <button data-mode="free" role="tab">Freies Spiel</button>
      </div>
      <span class="nn-time">Zeit <b id="cnTime">0:00</b></span>
    </div>
    <p class="cn-intro">Finde vier Gruppen zu je vier Begriffen. Vorsicht: Manche Wörter passen scheinbar in mehrere Gruppen.</p>
    <div class="cn-board">
      <div id="cnSolved" class="cn-solved"></div>
      <div id="cnGrid" class="cn-grid"></div>
      <div class="cn-msg" id="cnMsg" role="status" aria-live="polite"></div>
    </div>
    <div class="cn-under" id="cnControls">
      <div class="cn-mistakes"><span>Fehler übrig</span><span class="dots" id="cnMistakes"></span></div>
      <div class="cn-buttons">
        <button class="ghost" id="cnShuffle">Mischen</button>
        <button class="ghost" id="cnClear">Auswahl aufheben</button>
        <button id="cnSubmit">Prüfen</button>
      </div>
    </div>
    <div class="cn-end" id="cnEnd" hidden></div>
    <details class="cn-levels-help">
      <summary>Was bedeuten die Farben?</summary>
      <p><span class="sw y"></span> leicht <span class="sw g"></span> mittel <span class="sw b"></span> Wortteile <span class="sw p"></span> um die Ecke gedacht</p>
    </details>
  </div>
  <aside class="st-side" id="side"></aside>
</main>
<script src="/shared/motion.js"></script>
<script src="/raetsel/js/daily.js"></script>
<script src="/raetsel/js/connections-data.js"></script>
<script src="/raetsel/js/connections.js"></script>
<script src="/shared/me.js"></script>
</body>
</html>
