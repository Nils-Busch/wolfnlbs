<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory · Spielegalerie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="stylesheet" href="/spiele/css/style.css">
</head>
<body>
<header class="top"><a href="/spiele/" class="back">← Galerie</a><h1>🃏 Memory</h1></header>
<main class="solo">
  <div>
    <div class="hud"><div class="stat">Züge<b id="moves">0</b></div><div class="stat">Paare<b id="pairs">0/8</b></div><div class="stat">Zeit<b id="time">0:00</b></div><div class="spacer"></div><button id="newGame" class="ghost">Neu mischen</button></div>
    <div class="board-wrap">
      <div class="mem" id="board"></div>
      <div class="overlay" id="overlay" hidden><p id="ovText"></p><div class="row" id="ovButtons"><button id="ovBtn">Nochmal</button></div></div>
    </div>
    <p class="hint">Decke zwei Karten auf – finde alle 8 Paare mit möglichst wenigen Zügen.</p>
  </div>
  <aside id="scores"></aside>
</main>
<script src="/spiele/js/scores.js"></script>
<script src="/spiele/js/games/memory.js"></script>
</body>
</html>
